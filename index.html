    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is XShots free?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. XShots is free and open source, and you don't need an account to use it." }
          },
          {
            "@type": "Question",
            "name": "Which links are supported?",
            "acceptedAnswer": { "@type": "Answer", "text": "Any x.com or twitter.com post link, including mobile.twitter.com links, /i/web/status/ links and links pasted without https://." }
          },
          {
            "@type": "Question",
            "name": "Does XShots upload my data?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. XShots has no backend. Your browser fetches the post from the public FxTwitter API (or Twitter's oEmbed endpoint as a fallback) and renders the PNG locally. If a direct image fetch fails, XShots tries wsrv.nl as a fallback proxy. Nothing is stored by XShots." }
          },
          {
            "@type": "Question",
            "name": "What image quality do I get?",
            "acceptedAnswer": { "@type": "Answer", "text": "Images are exported as lossless PNG files at 1.5x pixel density (1800 px wide for landscape, 1620 px for portrait), so text and photos stay sharp." }
          },
          {
            "@type": "Question",
            "name": "Are quoted tweets and multiple images included?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. The image includes the quoted tweet if the post has one, and up to four images. Threads, videos and polls are not supported yet." }
          },
          {
            "@type": "Question",
            "name": "Why did my import fail?",
            "acceptedAnswer": { "@type": "Answer", "text": "Import is best effort. X platform restrictions and browser CORS rules can block remote content, in which case XShots shows a warning. Check the link and try again later." }
          }

  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:720px;margin:60px auto;padding:24px;font-family:sans-serif;line-height:1.6;color:#f3f1eb;">
        <h1>Paste a tweet URL. Get a clean share image.</h1>
        <p>
          XShots turns any tweet or X post into a clean PNG screenshot.
          Free, browser-based, no sign-up.
        </p>
        <p style="color:#f3c969;">Please enable JavaScript to use this tool.</p>

        <h2>How to turn a tweet into an image</h2>
        <ol>
          <li><strong>Copy the post link.</strong> Copy the URL of any X or Twitter post from the app or browser.</li>
          <li><strong>Paste and import.</strong> Paste it into XShots and import. XShots renders a clean card with the author, text, images and quoted tweet.</li>
          <li><strong>Export the PNG.</strong> Download the screenshot as a PNG or copy it to your clipboard.</li>
        </ol>

        <h2>Why XShots</h2>
        <ul>
          <li>Free and open source, with no account or sign-up.</li>
          <li>Runs entirely in your browser. No server stores your posts.</li>
          <li>Clean, high-resolution PNG output ready to share anywhere.</li>
          <li>Works with x.com and twitter.com links on desktop and mobile.</li>
        </ul>

        <h2>Frequently asked questions</h2>
        <h3>Is XShots free?</h3>
        <p>Yes. XShots is free and open source, and you don't need an account to use it.</p>
        <h3>Which links are supported?</h3>
        <p>Any x.com or twitter.com post link, including mobile.twitter.com links, /i/web/status/ links and links pasted without https://.</p>
        <h3>Does XShots upload my data?</h3>
        <p>No. XShots has no backend. Your browser fetches the post from the public FxTwitter API (or Twitter's oEmbed endpoint as a fallback) and renders the PNG locally. If a direct image fetch fails, XShots tries wsrv.nl as a fallback proxy. Nothing is stored by XShots.</p>
        <h3>What image quality do I get?</h3>
        <p>Images are exported as lossless PNG files at 1.5x pixel density (1800 px wide for landscape, 1620 px for portrait), so text and photos stay sharp.</p>
        <h3>Are quoted tweets and multiple images included?</h3>
        <p>Yes. The image includes the quoted tweet if the post has one, and up to four images. Threads, videos and polls are not supported yet.</p>
        <h3>Why did my import fail?</h3>
        <p>Import is best effort. X platform restrictions and browser CORS rules can block remote content, in which case XShots shows a warning. Check the link and try again later.</p>

        <p><a href="/privacy.html" style="color:#7ee0ff;">Privacy Policy</a></p>
      </main>
    </noscript>
